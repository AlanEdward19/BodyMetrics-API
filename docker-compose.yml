services:
  mongodb:
    image: mongo:8.0
    container_name: bodymetrics-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bodymetrics
    volumes:
      - mongodb-data:/data/db

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: bodymetrics-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --location /data"
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  mongodb-data:
  azurite-data:

